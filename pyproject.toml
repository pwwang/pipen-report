[project]
name = "pipen-report"
dynamic = ["version"]
description = "Report generation system for pipen"
authors = [{ name = "pwwang", email = "pwwang@pwwang.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pipen>=1.1",
    "Markdown>=3",
    "copier>=9.5,<9.11; python_version < '3.10'",
    "copier>=9.5; python_version >= '3.10'",
    "python-slugify>=8",
    "imagesize>=1.4",
]

[tool.hatch.version]
path = "pipen_report/versions.py"

[project.optional-dependencies]
runinfo = ["pipen-runinfo>=1.1,<2"]

[project.urls]
Homepage = "https://github.com/pwwang/pipen-report"
Repository = "https://github.com/pwwang/pipen-report"

[project.entry-points.pipen]
report = "pipen_report.report_plugin:PipenReport"

[project.entry-points.pipen_cli]
cli-report = "pipen_report.cli:PipenCliReport"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "pytest-xdist>=3",
    "pytest-forked>=1",
    "pytest-asyncio>=1",
    "pipen-filters>=1.1",
    "pipen-gcs>=1.1.2",
    "pipen-verbose>=1.1",
    "pillow>=11",
    "python-dotenv>=1",
    "cloudsh>=0.3",
    "backports-asyncio-runner>=1.1; python_version < '3.11'",
    "ghp-import>=2.1.0",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-rtd>=0.0,<0.1",
    "pymdown-extensions>=10,<11",
    "mkapi-fix>=0.1,<0.2",
]

[tool.uv]
prerelease = "allow"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipen_report"]

[tool.pytest.ini_options]
addopts = "-vv -n auto -W error::UserWarning --cov-config=.coveragerc --cov=pipen_report --cov-report xml:.coverage.xml --cov-report term-missing"
console_output_style = "progress"
junit_family = "xunit1"
filterwarnings = [
    "ignore:The --rsyncdir command line argument and rsyncdirs config variable are deprecated.:DeprecationWarning",
    "ignore:.+may lead to deadlocks in the child:DeprecationWarning",
]
asyncio_mode = "auto"

[tool.mypy]
ignore_missing_imports = true
allow_redefinition = true
disable_error_code = ["attr-defined", "no-redef", "import"]
show_error_codes = true
strict_optional = false

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
